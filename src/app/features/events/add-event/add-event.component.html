<div class="container mt-4">
  <h2>Ajouter un événement</h2>

  <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">

    <!-- Titre -->
    <div class="form-group mb-3">
      <label for="titre">Titre</label>
      <input id="titre" type="text" class="form-control" formControlName="titre" placeholder="Titre de l'événement">
      <small *ngIf="hasError('titre','required')" class="text-danger">Titre obligatoire</small>
      <small *ngIf="hasError('titre','minlength')" class="text-danger">Minimum 5 caractères</small>
      <small *ngIf="hasError('titre','pattern')" class="text-danger">Lettres et espaces uniquement</small>
    </div>

    <!-- Description -->
    <div class="form-group mb-3">
      <label for="description">Description</label>
      <textarea id="description" rows="4" class="form-control" formControlName="description" placeholder="Décrivez l'événement"></textarea>
      <small *ngIf="hasError('description','required')" class="text-danger">Description obligatoire</small>
      <small *ngIf="hasError('description','minlength')" class="text-danger">Minimum 30 caractères</small>
    </div>

    <!-- Date -->
    <div class="form-group mb-3">
      <label for="date">Date</label>
      <input id="date" type="date" class="form-control" formControlName="date">
      <small *ngIf="hasError('date','required')" class="text-danger">Date obligatoire</small>
    </div>

    <!-- Lieu -->
    <div class="form-group mb-3">
      <label for="lieu">Lieu</label>
      <input id="lieu" type="text" class="form-control" formControlName="lieu" placeholder="Lieu de l'événement">
      <small *ngIf="hasError('lieu','required')" class="text-danger">Lieu obligatoire</small>
    </div>

    <!-- Prix -->
    <div class="form-group mb-3">
      <label for="prix">Prix (DT)</label>
      <input id="prix" type="text" class="form-control" formControlName="prix" placeholder="Ex: 20.5">
      <small *ngIf="hasError('prix','required')" class="text-danger">Prix obligatoire</small>
      <small *ngIf="hasError('prix','pattern')" class="text-danger">Format invalide (ex: 12.5)</small>
    </div>

    <!-- Image -->
    <div class="form-group mb-3">
      <label for="imageUrl">Image (chemin ou URL)</label>
      <input id="imageUrl" type="text" class="form-control" formControlName="imageUrl" placeholder="assets/images/event.jpg">
    </div>

    <!-- Nombre de places -->
    <div class="form-group mb-4">
      <label for="nbPlaces">Nombre de places</label>
      <input id="nbPlaces" type="number" class="form-control" formControlName="nbPlaces" placeholder="Ex: 50">
      <small *ngIf="hasError('nbPlaces','required')" class="text-danger">Champ obligatoire</small>
      <small *ngIf="hasError('nbPlaces','pattern')" class="text-danger">Doit être entre 1 et 100</small>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="eventForm.invalid">Ajouter</button>
  </form>

  <div class="mt-4">
    <h6>Aperçu JSON</h6>
    <pre>{{ eventForm.value | json }}</pre>
  </div>
</div>
